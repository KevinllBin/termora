name: Build Plugins

on:
  workflow_dispatch:
  push:
    paths:
      - plugins/sync/**
      - plugins/webdav/**
      - plugins/common.gradle.kts
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - gradlew
      - gradlew.bat
      - .github/workflows/plugins-build.yml
  pull_request:
    paths:
      - plugins/sync/**
      - plugins/webdav/**
      - plugins/common.gradle.kts
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - gradlew
      - gradlew.bat
      - .github/workflows/plugins-build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build sync and webdav plugins
        run: ./gradlew :plugins:webdav:build :plugins:sync:build -x test

      - name: Upload webdav plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termora-plugin-webdav
          path: build/plugins/webdav/**
          if-no-files-found: error

      - name: Upload sync plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termora-plugin-sync
          path: build/plugins/sync/**
          if-no-files-found: error
